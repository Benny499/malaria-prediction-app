<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — Malaria Detection Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f5f5f5;
      background-image: radial-gradient(#c8e6c9 1px, transparent 1px);
      background-size: 20px 20px;
      transition: background 0.4s, color 0.4s;
      padding: 40px 16px;
      color: #1a1a1a;
    }

    body.dark {
      background-color: #0f0f0f;
      background-image: none;
      color: #f0f0f0;
    }

    body.dark::after {
      content: '';
      position: fixed;
      bottom: -80px;
      right: -80px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(34,197,94,0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 48px;
      height: 42px;
      padding: 5px 10px 5px 6px;
      border: 1px solid #d4e4d6;
      border-radius: 999px;
      background: rgba(255,255,255,0.9);
      color: #38613c;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(46,125,50,0.14);
      transition: background 0.3s, border-color 0.3s, color 0.3s, transform 0.2s;
    }
    .theme-toggle:hover { transform: translateY(-1px); border-color: #75a77a; }
    .theme-toggle:focus-visible { outline: 3px solid rgba(76,175,80,0.35); outline-offset: 3px; }
    .toggle-track { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #e9f5ea; }
    .toggle-label { font-size: 0.72rem; font-weight: 700; }
    body.dark .theme-toggle { background: rgba(30,42,35,0.96); border-color: #496d51; color: #d7f0da; }
    body.dark .toggle-track { background: #315638; }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.92);
      border: none;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.10);
      padding: 44px 40px;
      width: 100%;
      max-width: 440px;
      animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }

    body.dark .card {
      background: rgba(24,24,24,0.97);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .portal-icon {
      font-size: 2rem;
      display: block;
      text-align: center;
      margin-bottom: 10px;
      animation: spinIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
      animation-delay: 0.1s;
    }

    @keyframes spinIn {
      from { opacity: 0; transform: rotate(-180deg) scale(0.5); }
      to   { opacity: 1; transform: rotate(0deg) scale(1); }
    }

    .card h1 {
      font-size: 1.55rem;
      font-weight: 700;
      text-align: center;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    body.dark .card h1 { color: #f0f0f0; }

    .subtitle {
      text-align: center;
      font-size: 0.88rem;
      color: #666;
      margin-bottom: 28px;
    }

    body.dark .subtitle { color: #aaa; }

    .flash-box {
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 18px;
      font-size: 0.87rem;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: none; }
    }

    .flash-danger  { background: #fdecea; color: #b71c1c; }
    .flash-success { background: #e8f5e9; color: #1b5e20; }
    .flash-info    { background: #e3f2fd; color: #0d47a1; }
    body.dark .flash-danger  { background: #3b1010; color: #ef9a9a; }
    body.dark .flash-success { background: #0f2e0f; color: #a5d6a7; }
    body.dark .flash-info    { background: #0d2137; color: #90caf9; }

    .field-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      margin-top: 16px;
      letter-spacing: 0.02em;
    }

    body.dark .field-label { color: #aaa; }

    .input-wrap { position: relative; }

    .input-wrap .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #2e7d32;
      font-size: 0.88rem;
      pointer-events: none;
    }

    body.dark .input-wrap .icon { color: #4caf50; }

    .input-wrap input {
      width: 100%;
      padding: 12px 42px;
      border: 1.5px solid #ddd;
      border-radius: 11px;
      font-size: 0.95rem;
      background: #fafafa;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
    }

    .input-wrap input:focus {
      border-color: #2e7d32;
      box-shadow: 0 0 0 3px rgba(46,125,50,0.12);
      transform: translateY(-1px);
      background: #fff;
    }

    body.dark .input-wrap input {
      background: #1e1e1e;
      border-color: #333;
      color: #f0f0f0;
    }

    body.dark .input-wrap input:focus {
      border-color: #4caf50;
      box-shadow: 0 0 0 3px rgba(76,175,80,0.15);
      background: #252525;
    }

    .input-wrap input::placeholder { color: #bbb; }

    .eye-btn {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      padding: 0;
      font-size: 0.88rem;
      transition: color 0.2s;
    }

    .eye-btn:hover { color: #2e7d32; }
    body.dark .eye-btn:hover { color: #4caf50; }

    .btn-google {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #ddd;
      border-radius: 11px;
      background: #fff;
      color: #333;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
      margin-bottom: 6px;
    }

    .btn-google:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      transform: translateY(-1px);
      border-color: #bbb;
    }

    body.dark .btn-google {
      background: #1e1e1e;
      border-color: #333;
      color: #f0f0f0;
    }

    body.dark .btn-google:hover { border-color: #555; }

    .google-logo { width: 18px; height: 18px; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: #bbb;
      font-size: 0.8rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e0e0e0;
    }

    body.dark .divider::before,
    body.dark .divider::after { background: #333; }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 11px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(46,125,50,0.25);
    }

    .btn-submit:hover {
      background: #1b5e20;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(46,125,50,0.35);
    }

    .btn-submit:active { transform: translateY(0); }

    body.dark .btn-submit { background: #388e3c; }
    body.dark .btn-submit:hover { background: #2e7d32; }

    .footer-link {
      text-align: center;
      margin-top: 22px;
      font-size: 0.87rem;
      color: #777;
    }

    body.dark .footer-link { color: #aaa; }

    .footer-link a {
      color: #2e7d32;
      font-weight: 600;
      text-decoration: none;
    }

    body.dark .footer-link a { color: #66bb6a; }
    .footer-link a:hover { text-decoration: underline; }

    .field-group {
      animation: slideUp 0.45s cubic-bezier(0.16,1,0.3,1) both;
    }

    .field-group:nth-child(1) { animation-delay: 0.15s; }
    .field-group:nth-child(2) { animation-delay: 0.22s; }
  </style>
</head>
<body>

  <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" type="button" aria-pressed="false">
    <span class="toggle-track"><i id="themeIcon" class="fas fa-moon" aria-hidden="true"></i></span>
    <span id="themeLabel" class="toggle-label">Light</span>
  </button>

  <div class="card">

    <span class="portal-icon">🦟</span>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to the Malaria Detection Portal</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-box flash-{{ category }}">
            <i class="fas fa-{{ 'exclamation-circle' if category == 'danger' else 'check-circle' }}"></i>
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <button class="btn-google" type="button" onclick="window.location.href='/auth/google/login'">
      <svg class="google-logo" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or sign in with email</div>

    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field-group">
        <label class="field-label">Email Address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope icon"></i>
          <input type="email" name="email" placeholder="you@example.com" required/>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock icon"></i>
          <input type="password" name="password" id="pw1" placeholder="Enter your password" required/>
          <button type="button" class="eye-btn" onclick="togglePw('pw1','eye1')">
            <i class="fas fa-eye" id="eye1"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fas fa-sign-in-alt"></i>
        Sign In
      </button>

    </form>

    <div class="footer-link">
      Don't have an account? <a href="/register">Create one</a>
    </div>

  </div>

  <script>
    const body = document.body;
    const btn = document.getElementById('themeBtn');
    const saved = localStorage.getItem('theme') || 'light';
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');
    function setTheme(isDark) {
      body.classList.toggle('dark', isDark);
      themeIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
      themeLabel.textContent = isDark ? 'Dark' : 'Light';
      btn.title = isDark ? 'Switch to light mode' : 'Switch to dark mode';
      btn.setAttribute('aria-label', btn.title);
      btn.setAttribute('aria-pressed', String(isDark));
    }
    setTheme(saved === 'dark');

    function toggleTheme() {
      const isDark = !body.classList.contains('dark');
      setTheme(isDark);
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    function togglePw(fieldId, iconId) {
      const f = document.getElementById(fieldId);
      const i = document.getElementById(iconId);
      f.type = f.type === 'password' ? 'text' : 'password';
      i.className = f.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    }
  </script>

</body>
</html>
